<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 冰箱门传感器 - 门敞开 (open) -->
    <!-- 箱体，门已打开露出内部 -->
    <rect x="10" y="8" width="14" height="24" rx="3" fill="#E0F2FE"/>
    <rect x="10" y="8" width="14" height="24" rx="3" stroke="#94A3B8" stroke-width="2"/>
    <!-- 敞开的门板 -->
    <path d="M24 10L32 14V30L24 30V10Z" fill="#F8FAFC"/>
    <path d="M24 10L32 14V30L24 30V10Z" stroke="#94A3B8" stroke-width="2"/>
    <!-- 门把手 -->
    <rect x="29" y="19" width="2" height="6" rx="1" fill="#64748B"/>
    <!-- 传感器指示灯，橙色告警 -->
    <circle cx="16" cy="12" r="2.5" fill="#F59E0B"/>
    <!-- 冷气流失 -->
    <path d="M14 22H20" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 26H18" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
</svg>
