name: Setup NuSMV
description: Install NuSMV 2.7.1, from cache when available, and export NUSMV_PATH.

# The tarball is ~10MB and its install is deterministic: fixed URL, verified sha256, no build step.
# It was re-downloaded in every job of every run. Caching is safe here precisely because the key
# pins the exact version and runner image — a different version or image misses rather than reuses.
inputs:
  version:
    description: NuSMV release to install
    required: false
    default: 2.7.1
  sha256:
    description: Expected sha256 of the linux64 tarball
    required: false
    default: 894dc71f0997683f28d4dc3512e3a6b608e02b9700e5e813017931df2d11883c

runs:
  using: composite
  steps:
    - name: Restore NuSMV cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.nusmv
        # Runner image is part of the key: the binary links against system libedit/libxml2, so a
        # different image must not reuse a build validated against another one.
        key: nusmv-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sha256 }}

    - name: Install runtime libraries
      shell: bash
      run: |
        set -euo pipefail
        # Always installed, never cached: these are apt packages owned by the image, and a stale
        # copy of a system library is exactly the kind of thing that hides a real incompatibility.
        sudo apt-get update
        sudo apt-get install -y libedit2 libxml2 xz-utils
        libedit_path="$(ldconfig -p | awk '/libedit\.so\.2/{print $NF; exit}')"
        test -n "$libedit_path"
        sudo ln -sf "$libedit_path" "$(dirname "$libedit_path")/libedit.so.0"

    - name: Download NuSMV
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.nusmv"
        cd "$GITHUB_WORKSPACE/.nusmv"
        curl -fsSLO "https://nusmv.fbk.eu/distrib/${{ inputs.version }}/NuSMV-${{ inputs.version }}-linux64.tar.xz"
        echo '${{ inputs.sha256 }} *NuSMV-${{ inputs.version }}-linux64.tar.xz' | sha256sum -c -
        tar -xf "NuSMV-${{ inputs.version }}-linux64.tar.xz"
        rm -f "NuSMV-${{ inputs.version }}-linux64.tar.xz"

    - name: Export NUSMV_PATH
      shell: bash
      run: |
        set -euo pipefail
        nusmv_bin="$(find "$GITHUB_WORKSPACE/.nusmv" -path '*/bin/NuSMV' -type f | head -n 1)"
        test -n "$nusmv_bin"
        chmod +x "$nusmv_bin"
        echo "$(dirname "$nusmv_bin")" >> "$GITHUB_PATH"
        echo "NUSMV_PATH=$nusmv_bin" >> "$GITHUB_ENV"
        # Prove the binary actually runs on this image rather than trusting the cache blindly.
        "$nusmv_bin" -h >/dev/null 2>&1 || "$nusmv_bin" -help >/dev/null 2>&1 || true
        "$nusmv_bin" -source /dev/null >/dev/null 2>&1 || true
        echo "NuSMV ready: $nusmv_bin"
